name: mirrorchyan_release

on:
  workflow_dispatch:
    inputs:
        tag:
            default: ''
            required: false

jobs:
  mirrorchyan:
    if: ${{ github.repository_owner == 'siying233' }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        os: [win, macos]
        arch: [aarch64, x86_64]
    steps:
      - uses: MirrorChyan/uploading-action@v1
        with:
          filetype: latest-release
          filename: ${{ format('Maa_HLR-{0}-{1}-*', matrix.os, matrix.arch) }}
          mirrorchyan_rid: Maa_HLR
          tag: ${{ inputs.tag }}

          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}

          owner: siying233
          repo: Maa_HLR
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}
