name: install

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "**.py"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "**.py"
  workflow_dispatch:

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: set_tag
        run: |
          # 检查标签格式
          is_release=${{ startsWith(github.ref, 'refs/tags/v') }} 
          tag=$(git describe --tags --match "v*" ${{ github.ref }} || true)
          if [[ $tag != v* ]]; then
            tag=$(curl -sX GET "https://api.github.com/repos/${{ github.repository }}/releases/latest" --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' | awk '/tag_name/{print $4}' FS='["]')
            if [[ $tag != v* ]]; then
              tag="v0.0.0"
            fi
            tag=$(date "+$tag-%y%m%d-$(git rev-parse --short HEAD)")
          fi

          if ! $($is_release) ; then
            prefix=${tag%-*-*}
            suffix=${tag#$prefix-}
            tag="$prefix-ci.$suffix"
          fi

          # 检查是否为预发布版本
          is_prerelease=false
          if [[ $tag =~ .*alpha.* || $tag =~ .*beta.* || $tag =~ .*rc.* || $tag =~ .*dev.* || $tag =~ .*-ci.* ]]; then
            is_prerelease=true
            echo "This is a pre-release version"
          fi

          echo tag=$tag | tee -a $GITHUB_OUTPUT
          echo is_release=$is_release | tee -a $GITHUB_OUTPUT
          echo is_prerelease=$is_prerelease | tee -a $GITHUB_OUTPUT
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_tag.outputs.is_release }}
      is_prerelease: ${{ steps.set_tag.outputs.is_prerelease }}

  install:
    needs: meta
    strategy:
      matrix:
        include:
          # Windows
          - os: windows
            arch: x86_64
            runner: windows-latest
            mfaa_os_tag: win
          - os: windows
            arch: aarch64
            runner: windows-11-arm
            mfaa_os_tag: win
          # macOS
          - os: macos
            arch: x86_64
            runner: macos-15-intel
            mfaa_os_tag: osx
          - os: macos
            arch: aarch64
            runner: macos-latest
            mfaa_os_tag: osx
      fail-fast: false
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set platform variables
        id: platform
        shell: bash
        run: |
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            echo "tag=x64" >> $GITHUB_OUTPUT
          else
            echo "tag=arm64" >> $GITHUB_OUTPUT
          fi
      
      - name: Download MaaFramework
        uses: robinraju/release-downloader@v1
        with:
          repository: MaaXYZ/MaaFramework
          fileName: "MAA-${{ matrix.os == 'windows' && 'win' || 'macos' }}-${{ matrix.arch }}*"
          latest: true
          out-file-path: "deps"
          extract: true

      - name: Download MFAAvalonia
        id: download_mfa
        uses: robinraju/release-downloader@v1
        with:
          repository: MaaXYZ/MFAAvalonia
          fileName: "MFAAvalonia-*-${{ matrix.mfaa_os_tag }}-${{ steps.platform.outputs.tag }}*"
          latest: true
          out-file-path: "MFA"
          extract: true

      - name: Clean up MFAAvalonia archive
        shell: bash
        run: |
          ARCHIVE_FILE_PATH="${{ fromJson(steps.download_mfa.outputs.downloaded_files)[0] }}"
          rm -f "${ARCHIVE_FILE_PATH}"
          echo "Archive cleanup command executed for MFAAvalonia."

      - name: Convert PNG to ICO 
        if: matrix.os == 'windows' && matrix.arch == 'x86_64'
        shell: bash
        run: |
          choco install imagemagick -y # 使用 Windows 的 Chocolatey 包管理器静默安装 ImageMagick 图像处理工具
          # 将 logo.png 转换，并内嵌包含从 16x16 到 256x256 复合尺寸的标准 Windows .ico 图标文件
          magick convert assets/logo.png -define icon:auto-resize=256,128,64,48,32,24,16 maahlr.ico

      - name: Convert PNG to ICO (macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          brew install imagemagick
          magick convert assets/logo.png -define icon:auto-resize=256,128,64,48,32,24,16 maahlr.ico


      - name: Modify Windows exe icons # 【全新细节】逆向篡改并注入自定义软件图标
        if: matrix.os == 'windows' && matrix.arch == 'x86_64'
        shell: bash
        run: |
          # 下载微软生态小工具 rcedit，专门用于无源码修改 exe 的资源区段 (Resource Section)
          curl -L https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe -o rcedit.exe

          # 如果解压出的 MFA 界面程序存在，强行将其默认的 Avalonia 图标擦除，替换为我们刚刚生成的 maahlr.ico
          if [ -f "MFA/MFAAvalonia.exe" ]; then
            ./rcedit.exe "MFA/MFAAvalonia.exe" --set-icon "maahlr.ico"
            echo "MFAAvalonia icon modified successfully"
          else
            echo "MFAAvalonia exe not found, skipping icon update."
          fi

      - name: Modify Mac unix icons # 【全新细节】逆向篡改并注入自定义软件图标
        if: matrix.os == 'macos' && matrix.arch == 'arm64'
        shell: bash
        run: |
          # 检查你的二进制文件 Maa_HLR 是否存在
          if [ -f "MFAAvalonia" ]; then
            echo "MFAAvalonia found, injecting custom icon..."
            
            # 1. 使用 macOS 自带的 sips 将 .ico 转换为临时 .png，并直接生成隐式 icon 资源
            sips -s format png logo.ico --out temp.png > /dev/null
            sips -i temp.png > /dev/null

            # 2. 提取 temp.png 中的图标资源分支（Resource Fork）并追加写入到 Maa_HLR 中
            DeRez -only icns temp.png > temp.rsrc
            Rez -append temp.rsrc -o MFAAvalonia

            # 3. 开启 Maa_HLR 文件的“自定义图标”属性标记（Has Custom Icon）
            SetFile -a C MFAAvalonia

            # 4. 清理产生的临时文件
            rm temp.png temp.rsrc
            echo "MFAAvalonia icon modified successfully."
          else
            echo "MFAAvalonia binary not found, skipping icon update."
          fi
    
      - name: Setup Embed Python on Windows
        if: matrix.os == 'windows'
        shell: bash
        run: |
          python tools/ci/setup_embed_python.py
      
      - name: Setup Embed Python on macOS
        if: matrix.os == 'macos'
        shell: bash
        run: |
          python3 tools/ci/setup_embed_python.py
          EMBED_PYTHON_PATH="./install/python/bin/python3"
          if [ -f "$EMBED_PYTHON_PATH" ]; then
            echo "Setting execute permission for $EMBED_PYTHON_PATH"
            chmod +x "$EMBED_PYTHON_PATH"
          else
            echo "Warning: Embedded Python executable not found at $EMBED_PYTHON_PATH. Skipping chmod."
          fi

      - name: Download Python dependencies (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          ./install/python/python.exe tools/ci/download_deps.py --deps-dir install/deps

      - name: Download Python dependencies (macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          ./install/python/bin/python3 tools/ci/download_deps.py --deps-dir install/deps


      - name: Install
        shell: bash
        run: |
          PYTHON_CMD="${{ matrix.os == 'windows' && './install/python/python.exe' || './install/python/bin/python3' }}"
          PLATFORM_TAG="${{ matrix.os == 'windows' && 'win' || 'osx' }}-${{ steps.platform.outputs.tag }}"
          $PYTHON_CMD -m pip install json5
          cp -f tools/configure.py tools/ci/
          $PYTHON_CMD ./tools/ci/install.py ${{ needs.meta.outputs.tag }} $PLATFORM_TAG
          

      - name: Copy MFA files to main version
        shell: bash
        run: |
          if [ -d "MFA" ]; then
            echo "Copying MFA files to install directory..."
            mkdir -p install
            if [ "${{ matrix.os }}" = "windows" ]; then
              cp -rpvn MFA/. install/
              if [ -f "install/MFAAvalonia.exe" ]; then
                mv -f install/MFAAvalonia.exe install/Maa_HLR.exe
              fi
            else
              rsync -av --ignore-existing MFA/ install/
              if [ -f "install/MFAAvalonia" ]; then
                mv -f install/MFAAvalonia install/Maa_HLR
              elif [ -f "install/MFAAvalonia.exe" ]; then
                mv -f install/MFAAvalonia.exe install/Maa_HLR.exe
              fi
            fi
          else
            echo "MFA directory not found, skipping copy."
          fi

      - name: Copy custom icons
        shell: bash
        run: |
          # 删除 MFAA 自带的 Assets 文件夹
          if [ -d "install/Assets" ]; then
            rm -rf install/Assets
            echo "Removed original Assets folder"
          fi

          # MFAA 版本的图标放根目录
          if [ -f "maahlr.ico" ]; then
            cp maahlr.ico install/logo.ico
            echo "Copied custom icon to install/logo.ico"
          fi
      
      # - name: Install
      #   shell: bash
      #   run: |
      #     cd tools/
      #     python -m pip install -r ./requirements.txt
      #     python ./install.py ${{ needs.meta.outputs.tag }}
      #     cd ..

      #     if [[ "${{ matrix.os }}" != "android" ]]; then
      #       if [ -d "MFA" ]; then
      #         echo "Copying MFA files to install directory..."
      #         mkdir -p install
      #         rsync -av --ignore-existing MFA/ install/
      #       else
      #         echo "MFA directory not found, skipping copy."
      #       fi
      #       if [[ "${{ matrix.os }}" == "win" ]]; then
      #         mkdir -p install
      #         cp -v "tools/DependencySetup_依赖库安装.bat" install/
      #       fi
      #     else
      #       echo "Skipping copy MFA for Android."
      #     fi

      - uses: actions/upload-artifact@v4
        with:
          name: Maa_HLR-${{ matrix.os }}-${{ matrix.arch }}
          path: "install"

  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: .github/cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

  release:
    if: ${{ needs.meta.outputs.is_release == 'true' }}
    needs: [meta, install, changelog]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets

      - run: |
          cd assets
          for f in *; do
            if [[ $f == *"windows"* ]]; then
              (cd "$f" && zip -r "../$f.zip" .)
            else
              echo "Processing Unix artifact: $f"

              find "$f" -type f -name "MFAAvalonia*" -exec chmod +x {} \; 2>/dev/null || true
              echo "Set execute permission for all MFAAvalonia files"

              find "$f" -type f -name "MFAUpdater*" -exec chmod +x {} \; 2>/dev/null || true
              echo "Set execute permission for all MFAUpdater files"

              if [[ -f "$f/Maa_HLR" ]]; then
                chmod +x "$f/Maa_HLR"
                echo "Set execute permission for $f/Maa_HLR"
              fi

              PYTHON_PATHS=(
                "$f/python/bin/python3"
                "$f/python/python"
                "$f/python/bin/python"
                "$f/python/python.exe"
              )
              for PYTHON_PATH in "${PYTHON_PATHS[@]}"; do
                if [[ -f "$PYTHON_PATH" ]]; then
                  chmod +x "$PYTHON_PATH"
                  echo "Set execute permission for $PYTHON_PATH"
                fi
              done

              tar -cpzf "$f.tar.gz" -C "$f" .
              echo "Created archive with preserved permissions: $f.tar.gz"
            fi
          done
          
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          tag_name: ${{ needs.meta.outputs.tag }}
          body: ${{ needs.changelog.outputs.release_body }}
          draft: false
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}

        # Mirror酱为第三方分发服务，新项目默认关闭
        # 若有需要请联系 Mirror酱 开通，直接自行开启是无法使用的
        # https://mirrorchyan.com/
